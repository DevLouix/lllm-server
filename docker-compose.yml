version: "3.8"

services:
  lllm-server:
    image: ollama/ollama:latest
    container_name: model-server
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h     # Keep models loaded in RAM to eliminate cold-start latency
      - OLLAMA_NUM_PARALLEL=1    # Limit CPU threading to avoid thrashing dual/quad-core CPUs
    entrypoint:
      - /bin/sh
      - -c
      - |
        # 1. Start Ollama server in background
        ollama serve &
        
        # 2. Poll API until server is healthy using curl
        echo "Waiting for Ollama engine to boot..."
        until curl -s http://127.0.0.1:11434/ > /dev/null; do
          sleep 1
        done
        
        # 3. Auto-pull lightweight models/agents
        echo "Pulling lightweight models..."
        ollama pull smollm2:1.7b
        ollama pull qwen2.5:1.5b
        
        # 4. Wait on background process to keep container running
        wait
